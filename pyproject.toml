[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-joint-optimizer"
version = "0.1.0"
description = "Joint warehouse order batching, routing and multi-picker scheduling"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
demo = ["streamlit>=1.62,<2", "matplotlib>=3.7,<4", "pandas>=2,<4"]
test = ["pytest>=7,<10"]

[project.scripts]
warehouse-opt = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

